name: Release installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: powershell
        run: |
          $dl = "$env:TEMP\innosetup.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $dl
          Start-Process -FilePath $dl -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait
          Test-Path "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"

      - name: Publish self-contained exe
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -o .\dist\app

      - name: Compile installer
        shell: powershell
        run: |
          & "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" installer.iss

      # Firma de codigo gratuita para open source via SignPath Foundation.
      # Requiere que el repo sea publico y tenga licencia OSS (LICENSE).
      # Configura en Settings > Secrets and variables > Actions:
      #   - Secret:    SIGNPATH_API_TOKEN
      #   - Variables: SIGNPATH_ORG_ID, SIGNPATH_PROJECT_ID, SIGNPATH_POLICY_ID (slugs)
      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        id: upload-contract
        with:
          name: installer-unsigned
          path: DeepSeekDesktop-Setup.exe

      - name: Sign installer with SignPath
        if: ${{ env.SIGN_ENABLED == 'true' }}
        env:
          SIGN_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_ID }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_ID }}
          github-artifact-id: ${{ steps.upload-contract.outputs.artifact-id }}
          output-artifact-directory: signed
          wait-for-completion: true

      - name: Replace with signed installer
        if: ${{ env.SIGN_ENABLED == 'true' }}
        shell: powershell
        env:
          SIGN_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        run: |
          $signed = Get-ChildItem -Recurse -Filter "DeepSeekDesktop-Setup.exe" -Path "signed" | Select-Object -First 1
          Copy-Item $signed.FullName -Destination "DeepSeekDesktop-Setup.exe" -Force
          Write-Host "Usando instalador firmado: $($signed.FullName)"

      - name: Verify installer signature
        if: ${{ env.SIGN_ENABLED == 'true' }}
        shell: powershell
        env:
          SIGN_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        run: |
          $sig = Get-AuthenticodeSignature -FilePath "DeepSeekDesktop-Setup.exe"
          Write-Host "Signature status: $($sig.Status)"
          if ($sig.Status -ne "Valid") {
            Write-Host "Instalador NO firmado correctamente. Comprueba SignPath."
            exit 1
          }
          Write-Host "Instalador firmado OK."

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: DeepSeekDesktop-Setup.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DeepSeekDesktop-Setup.exe
          generate_release_notes: true